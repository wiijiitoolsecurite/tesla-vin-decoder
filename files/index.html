<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dash Player</title>
<meta name="theme-color" content="#0a0c0f">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<section id="screen-login" class="screen screen-login">
  <div class="login-card">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1 class="brand-name">DASH<span>PLAYER</span></h1>
    </div>

    <form id="login-form" class="login-form" autocomplete="off">
      <label class="field">
        <span class="field-label">Adresse du serveur</span>
        <input type="text" id="input-server" placeholder="http://exemple.com:8080" required inputmode="url">
      </label>
      <label class="field">
        <span class="field-label">Identifiant</span>
        <input type="text" id="input-username" placeholder="Identifiant" required autocapitalize="off">
      </label>
      <label class="field">
        <span class="field-label">Mot de passe</span>
        <input type="password" id="input-password" placeholder="Mot de passe" required>
      </label>

      <label class="field-check">
        <input type="checkbox" id="input-remember">
        <span>Rester connecté sur cet appareil</span>
      </label>

      <button type="submit" id="btn-connect" class="btn btn-primary btn-large">Se connecter</button>
      <p id="login-error" class="login-error" hidden></p>
    </form>
  </div>
</section>

<!-- ===================== APP SHELL ===================== -->
<section id="screen-app" class="screen screen-app" hidden>

  <header class="topbar">
    <button id="btn-back" class="icon-btn back-btn" hidden aria-label="Retour">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <nav class="tabs" id="main-tabs">
      <button class="tab active" data-tab="live">Live</button>
      <button class="tab" data-tab="movies">Films</button>
      <button class="tab" data-tab="series">Séries</button>
    </nav>

    <div class="topbar-actions">
      <button id="btn-search" class="icon-btn" aria-label="Recherche">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button id="btn-logout" class="icon-btn" aria-label="Déconnexion">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- search bar (collapsed by default) -->
  <div id="search-bar" class="search-bar" hidden>
    <input type="text" id="search-input" placeholder="Rechercher…" inputmode="search">
    <button id="btn-search-close" class="icon-btn" aria-label="Fermer">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="content-area">

    <!-- category rail -->
    <aside id="category-rail" class="category-rail">
      <div class="rail-title">Catégories</div>
      <div id="category-list" class="category-list"></div>
    </aside>

    <!-- item grid -->
    <main id="item-grid" class="item-grid">
      <div id="grid-empty" class="grid-empty" hidden>Aucun contenu ici.</div>
      <div id="grid-loading" class="grid-loading" hidden>Chargement…</div>
      <div id="grid-content" class="grid-content"></div>
    </main>

    <!-- episode list panel (series) -->
    <aside id="episode-panel" class="episode-panel" hidden>
      <div class="rail-title" id="episode-panel-title">Saisons</div>
      <div id="season-tabs" class="season-tabs"></div>
      <div id="episode-list" class="episode-list"></div>
    </aside>

  </div>
</section>

<!-- ===================== PLAYER SCREEN ===================== -->
<section id="screen-player" class="screen screen-player" hidden>
  <div class="player-wrap">
    <video id="video-el" playsinline webkit-playsinline></video>

    <div id="player-overlay" class="player-overlay">
      <div class="player-top">
        <button id="btn-player-close" class="icon-btn" aria-label="Fermer le lecteur">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="player-title" class="player-title"></span>
        <button id="btn-favorite" class="icon-btn" aria-label="Favori">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.1C.5 8.4 2.4 5 6 5c2 0 3.4 1 4 2.3C10.6 6 12 5 14 5c3.6 0 5.5 3.4 4 6.9-2.5 4.5-10 9.1-10 9.1z"/></svg>
        </button>
      </div>

      <div id="player-status" class="player-status" hidden></div>

      <div class="player-controls">
        <button id="btn-playpause" class="icon-btn big" aria-label="Lecture / Pause">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7V5z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>

        <div class="progress-wrap">
          <span id="time-current" class="time">00:00</span>
          <input type="range" id="seek-bar" class="seek-bar" min="0" max="100" value="0" step="0.1">
          <span id="time-duration" class="time">--:--</span>
        </div>

        <div class="volume-wrap">
          <svg viewBox="0 0 24 24" class="vol-icon"><path d="M4 9v6h4l5 5V4L8 9H4z"/></svg>
          <input type="range" id="volume-bar" class="volume-bar" min="0" max="1" value="1" step="0.01">
        </div>

        <button id="btn-fullscreen" class="icon-btn" aria-label="Plein écran">
          <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>

<div id="toast" class="toast" hidden></div>

<script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
